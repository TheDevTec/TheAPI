plugins {
	id 'java-library'
    id 'maven-publish'
}

def versionValue = System.getenv('VERSION') ?: '14.0'
group = 'me.devtec.theapi.loaders'
version = versionValue

repositories {
    mavenCentral()
    mavenLocal()
}

allprojects {
    repositories {
        maven {
            url = 'https://jitpack.io'
        }
    }
}

dependencies {
    implementation 'com.github.TheDevTec:TheAPI-Shared:14.0'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

	java {
	    sourceCompatibility = JavaVersion.VERSION_1_8
	    targetCompatibility = JavaVersion.VERSION_1_8
	}
	
	tasks.withType(JavaCompile).configureEach {
	    options.encoding = 'UTF-8'
	    options.release = 8
	    options.annotationProcessorPath = configurations.annotationProcessor
	}

    tasks.processResources {
        filesMatching("plugin.yml") {
            expand(["version": versionValue])
        }
        filesMatching("bungee.yml") {
            expand(["version": versionValue])
        }
        filesMatching("velocity-plugin.json") {
            expand(["version": versionValue])
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
        implementation 'com.github.TheDevTec:TheAPI-Shared:14.0'
    }

    task buildJar(type: Jar) {
        from {
            configurations.runtimeClasspath.collect {
                it.isDirectory() ? it : zipTree(it)
            }
        }

        from sourceSets.main.output

        archiveBaseName.set(project.name)
        archiveVersion.set(versionValue)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = project.name
                version = versionValue
                from components.java
            }
        }
    }
}

task buildJar(type: Jar) {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from subprojects.collect { it.sourceSets.main.output }
    archiveBaseName.set(project.name)
    archiveVersion.set(versionValue)
}

publishing {
    publications {
        jar(MavenPublication) {
            from components.java
            artifactId = 'TheAPI'
            version = versionValue
            publishJarPublicationToMavenLocal.dependsOn buildJar

        }
    }
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

build.dependsOn buildJar